# Build + déploiement Coach Gandalf (contrat Gandalf) — modèle xero/elearning.
# Build en northamerica-northeast1 → déploiement Cloud Run en us-east1
# (antigravity prod). Install du SDK privé @bleuh-co via secret BuildKit
# (jamais gravé dans l'image).

substitutions:
  _SERVICE: coach-gandalf
  _REGION_DEPLOY: us-east1
  _TAG: latest
  _IMAGE: us-east1-docker.pkg.dev/antigravity-20260107/cloud-run-source-deploy/coach-gandalf
  # ID Firestore de l'app dans la collection `apps` du hub (prod) — à renseigner
  # au moment de créer le trigger, ou laisser vide (fallback matcher par nom).
  _COACHGANDA_APP_ID: ""
  _APP_PUBLIC_URL: https://coach-gandalf-271227085398.us-east1.run.app

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ["GH_PKG_TOKEN"]
    args:
      - -c
      - |
        set -euo pipefail
        trap 'rm -f /workspace/gh_token' EXIT
        printf '%s' "$$GH_PKG_TOKEN" > /workspace/gh_token
        DOCKER_BUILDKIT=1 docker build \
          --secret id=gh_token,src=/workspace/gh_token \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyBj17yDs3xOQq8lFYjOfx3TmKTeIPANNXs \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=antigravity-20260107.firebaseapp.com \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=antigravity-20260107 \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=antigravity-20260107.firebasestorage.app \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=271227085398 \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:271227085398:web:dd67b650261fbb28d551f7 \
          --build-arg NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS=chanv.com,lafeuilleverte.ca,bleuh.co,maisondherbes.com \
          --build-arg NEXT_PUBLIC_HUB_URL=https://chanv-apps-hub-271227085398.northamerica-northeast1.run.app \
          -t "${_IMAGE}:${_TAG}" .
        rm -f /workspace/gh_token

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${_TAG}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${_TAG}
      - --project=antigravity-20260107
      - --region=${_REGION_DEPLOY}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --update-env-vars=^;^NEXT_PUBLIC_FIREBASE_PROJECT_ID=antigravity-20260107;NEXT_PUBLIC_HUB_URL=https://chanv-apps-hub-271227085398.northamerica-northeast1.run.app;NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS=chanv.com,lafeuilleverte.ca,bleuh.co,maisondherbes.com;COACHGANDA_APP_ID=${_COACHGANDA_APP_ID};APP_PUBLIC_URL=${_APP_PUBLIC_URL}
      - --set-secrets=FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,EXERCISEDB_API_KEY=EXERCISEDB_API_KEY:latest,SPOTIFY_CLIENT_ID=SPOTIFY_CLIENT_ID:latest,SPOTIFY_CLIENT_SECRET=SPOTIFY_CLIENT_SECRET:latest,ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest

images:
  - "${_IMAGE}:${_TAG}"

availableSecrets:
  secretManager:
    - versionName: projects/antigravity-20260107/secrets/GITHUB_PACKAGES_TOKEN/versions/latest
      env: GH_PKG_TOKEN

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
