# Build + déploiement Coach Gandalf (contrat Gandalf) — modèle xero/elearning.
# Build et deploiement Cloud Run en us-east1
# (antigravity prod). Install du SDK privé @bleuh-co via secret BuildKit
# (jamais gravé dans l'image).

substitutions:
  _SERVICE: coach-gandalf
  _REGION_DEPLOY: us-east1
  _TAG: latest
  _IMAGE: us-east1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/coach-gandalf
  # ID Firestore de l'app dans la collection `apps` du hub (prod) — à renseigner
  # au moment de créer le trigger, ou laisser vide (fallback matcher par nom).
  _COACHGANDA_APP_ID: "iNv9JSBZCVoRZihKaapn"
  _APP_PUBLIC_URL: https://coach-gandalf-${PROJECT_NUMBER}.us-east1.run.app

  # Defauts = PROD ; le declencheur de chaque environnement les surcharge.
  # Ce qui se deduit du projet qui build l'est via $PROJECT_ID / $PROJECT_NUMBER :
  # _FB_PROJECT_ID decide quelle base Firestore recoit les ecritures.
  _FB_API_KEY: AIzaSyBj17yDs3xOQq8lFYjOfx3TmKTeIPANNXs
  _FB_APP_ID: 1:271227085398:web:dd67b650261fbb28d551f7
  _FB_AUTH_DOMAIN: ${PROJECT_ID}.firebaseapp.com
  _FB_PROJECT_ID: ${PROJECT_ID}
  _FB_SENDER_ID: "${PROJECT_NUMBER}"
  _FB_STORAGE_BUCKET: ${PROJECT_ID}.firebasestorage.app
  _HUB_URL: https://gandalf.chanv.com
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ["GH_PKG_TOKEN"]
    args:
      - -c
      - |
        set -euo pipefail
        trap 'rm -f /workspace/gh_token' EXIT
        printf '%s' "$$GH_PKG_TOKEN" > /workspace/gh_token
        DOCKER_BUILDKIT=1 docker build \
          --secret id=gh_token,src=/workspace/gh_token \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY} \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN} \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FB_STORAGE_BUCKET} \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FB_SENDER_ID} \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP_ID} \
          --build-arg NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS=chanv.com,lafeuilleverte.ca,bleuh.co,maisondherbes.com \
          --build-arg NEXT_PUBLIC_HUB_URL=${_HUB_URL} \
          -t "${_IMAGE}:${_TAG}" .
        rm -f /workspace/gh_token

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${_TAG}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${_TAG}
      - --project=${PROJECT_ID}
      - --region=${_REGION_DEPLOY}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --update-env-vars=^;^NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID};NEXT_PUBLIC_HUB_URL=${_HUB_URL};HUB_URL=${_HUB_URL};NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS=chanv.com,lafeuilleverte.ca,bleuh.co,maisondherbes.com;COACHGANDA_APP_ID=${_COACHGANDA_APP_ID};APP_PUBLIC_URL=${_APP_PUBLIC_URL}
      - --set-secrets=FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,EXERCISEDB_API_KEY=EXERCISEDB_API_KEY:latest,SPOTIFY_CLIENT_ID=SPOTIFY_CLIENT_ID:latest,SPOTIFY_CLIENT_SECRET=SPOTIFY_CLIENT_SECRET:latest,ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest

images:
  - "${_IMAGE}:${_TAG}"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/GITHUB_PACKAGES_TOKEN/versions/latest
      env: GH_PKG_TOKEN

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
